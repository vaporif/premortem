  - title: 'BlockFi declares bankruptcy in aftershock of FTX''s collapse : NPR'
    url: https://www.npr.org/2022/11/28/1139431115/blockfi-ftx-bankruptcy-chapter-11
    content: '# Crypto company BlockFi declares bankruptcy in the first big aftershock of FTX''s fall. Another crypto company
      has fallen, as contagion from the collapse of cryptocurrency exchange FTX spreads across the industry: BlockFi says
      it has filed for bankruptcy. Announcing its plans to file for Chapter 11 reorganization in New Jersey, where the company
      is based, BlockFi noted FTX''s own bankruptcy proceedings will lead to delays. BlockFi''s restructuring underscores
      "significant" risks of contagion within the "crypto ecosystem," as well as potential deficiencies in how the companies
      manage risks, said Monsur Husain, a senior director at the agency. But BlockFi was especially at risk of collapsing
      in recent days because it has "significant exposure to FTX and associated corporate entities," as the company''s co-founders,
      CEO Zac Prince and COO Flori Marquez, put it in a letter to customers two weeks ago. BlockFi, a cryptocurrency lender,
      has filed for Chapter 11 bankruptcy. BlockFi, a cryptocurrency lender, has filed for Chapter 11 bankruptcy.'
    published_date: null
