  - title: 'FTX Collapse November 2022: What Happened & Lessons ... - Bitget'
    url: https://www.bitget.com/academy/ftx-collapse-nov-202
    content: 'FTX Collapse November 2022: What Happened & Lessons for Crypto Security. This article examines the collapse
      of FTX in November 2022, focusing on the events surrounding Sam Bankman-Fried''s final days at the company''s offices
      on November 8, 2022, the systemic failures that led to the exchange''s bankruptcy, and the broader implications for
      cryptocurrency exchange security and user protection. On November 8, 2022, FTX offices became the epicenter of one of
      the most dramatic collapses in cryptocurrency history. What began as a liquidity crisis rapidly escalated into a full-scale
      bankruptcy filing within days, exposing an $8 billion shortfall in customer funds. The events of that week revealed
      systematic misuse of customer deposits, inadequate risk controls, and a complete breakdown of the separation between
      FTX and its affiliated trading firm, Alameda Research. Following a CoinDesk report on November 2 that revealed Alameda
      Research''s balance sheet was heavily concentrated in FTT tokens (FTX''s native token), confidence in the platform had
      evaporated.'
