    content: '# Cryptocurrency exchange FTX files for Chapter 11 bankruptcy. `<iframe src="https://www.npr.org/player/embed/1136166792/1136166793"
      width="100%" height="290" frameborder="0" scrolling="no" title="NPR embedded audio player">`. FTX, one of the world''s
      largest cryptocurrency exchanges, filed for Chapter 11 bankruptcy Friday. It took less than a week for the company,
      and its once-popular CEO, to wipe out financially. Today one of the largest platforms for trading cryptocurrency filed
      for bankruptcy. It''s called FTX, a company that earlier this year was paying for commercials like this one, which aired
      during the Super Bowl. It shows a crypto booster trying to win over a skeptical Larry David. GURA: Well, on Friday,
      before the markets opened, FTX announced on Twitter it filed for bankruptcy. And critically, the company also announced
      its founder, Sam Bankman-Fried, who is barely 30 years old, by the way - Bankman-Fried is no longer FTX''s CEO. Here
      he is at a conference recalling how he got into this business.'
    published_date: null
  - title: Sam Bankman-Fried steps down, FTX files for bankruptcy
    url: https://www.cnbc.com/2022/11/11/sam-bankman-frieds-cryptocurrency-exchange-ftx-files-for-bankruptcy.html
    content: '# Sam Bankman-Fried steps down as FTX CEO as his crypto exchange files for bankruptcy. * Sam Bankman-Fried''s
      cryptocurrency exchange FTX has filed for bankruptcy. Sam Bankman-Fried, founder and chief executive officer of FTX
      Cryptocurrency Derivatives Exchange, during an interview on an episode of Bloomberg Wealth with David Rubenstein in
      New York, US, on Wednesday, Aug 17, 2022. Sam Bankman-Fried''s cryptocurrency exchange FTX has filed for Chapter 11
      bankruptcy protection in the U.S., according to a company statement posted on Twitter. **Update:** FTX founder Sam Bankman-Fried
      sentenced to 25 years for crypto fraud, to pay $11 billion in forfeiture. Approximately 130 additional affiliated companies
      are part of the proceedings, including Alameda Research, Bankman-Fried''s crypto trading firm, and FTX.us, the company''s
      U.S. subsidiary. In the 23-page bankruptcy filing obtained by CNBC, FTX indicates it has more than 100,000 creditors,
      assets in the range of $10 billion to $50 billion, as well as liabilities in the range of $10 billion to $50 billion.
      FTX''s Sam Bankman-Fried resigns as CEO.'
