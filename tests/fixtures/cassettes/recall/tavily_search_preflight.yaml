      of two Estonian citizens in a criminal fraud case unrelated to BlockFi’s bankruptcy. At the time, the DOJ argued that
      the US Bankruptcy Court for the District of New Jersey did not have the jurisdiction to prevent BlockFi from transferring
      the assets. Mohsin Meghji, Plan Administrator for BlockFi’s wind-down estates, represented the crypto firm in the case.
