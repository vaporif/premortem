      Texas — March 23, 2026 — The Texas State Securities Board announced today the entry of a Consent Order dated March 20,
      2026, resolving allegations against Voyager Digital Ltd., Voyager Digital Holdings, Inc., and Voyager Digital, LLC (collectively,
      Voyager). The Consent Order follows an investigation by the TSSB’s Enforcement Division into Voyager’s securities-related
      activities under the Texas Securities Act. Voyager operated a cryptocurrency brokerage platform that allowed customers
      to buy, sell, trade, and store digital assets. On April 12, 2022, the TSSB initiated administrative enforcement proceedings
      against Voyager by issuing a Notice of Hearing alleging violations of state securities laws. On July 5, 2022, Voyager
      filed for Chapter 11 bankruptcy protection in the United States Bankruptcy Court for the Southern District of New York.
