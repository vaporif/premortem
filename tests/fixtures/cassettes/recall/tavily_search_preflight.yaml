  - title: FTX Emerges from Bankruptcy Under $14+ Billion Plan | Sullivan & Cromwell LLP
    url: https://www.sullcrom.com/About/Rankings/2025/January/FTX-Emerges-Bankruptcy-Under-14-Billion-Plan
    content: S&C helped negotiate a string of novel settlements with governmental authorities and non-U.S. insolvency trustees,
      clearing the way for FTX to return to all non-governmental creditors *substantially more than 100 percent* of the amount
      normally due under the Bankruptcy Code. The extraordinary efforts of the S&C team coordinating this case were commended
      by Judge Dorsey, who described this as a “model case for how to deal with a very complex Chapter 11 bankruptcy proceeding.”.
      S&C’s unique strength in assembling multidisciplinary teams for major bankruptcies, investigations and litigation enabled
      a novel strategy to be set and executed with billions of dollars at stake. *The Wall Street Journal* wrote that this
      outcome “seemed unthinkable when [FTX] collapsed into bankruptcy in 2022,” adding that soon after FTX filed for bankruptcy,
      customer claims could be purchased for as little as three cents on the dollar. The team was led by Restructuring partners
      Andy Dietderich, Jim Bromley, Brian Glueckstein and Alexa Kranzley, and S&C lawyers in dozens of other practice areas
      and offices around the world.
    published_date: null
  - title: FTX bankruptcy | Law | Research Starters | EBSCO Research
    url: https://www.ebsco.com/research-starters/law/ftx-bankruptcy
    content: FTX bankruptcy refers to the fall of the FTX cryptocurrency exchange, founded by Sam Bankman-Fried, which began
      in November 2022. The situation escalated after a report revealed that Alameda Research, another company owned by Bankman-Fried,
      held a large amount of FTX's cryptocurrency token, FTT. This revelation led to a significant drop in FTT's value and
      triggered a search for new investments, which ultimately failed as a deal with competitor Binance fell through. On November
      11, 2022, both FTX and Alameda Research filed for bankruptcy, and Bankman-Fried resigned as CEO. The *FTX bankruptcy*
      refers to the collapse of the FTX cryptocurrency exchange, owned by Sam Bankman-Fried, beginning in November 2022. On
      November 2, 2022, CoinDesk published a piece stating that a trading company called Alameda Research, also owned by Bankman-Fried,
      held a disproportionately large amount of FTX’s cryptocurrency token, or asset, called FTT. On November 11, Alameda
      Research and FTX declared bankruptcy and Bankman-Fried stepped down as CEO of FTX.
    published_date: null
